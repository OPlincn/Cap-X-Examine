# Usage: see scripts/run_harness_eval.sh
# Derived from env_configs/cube_stack/franka_robosuite_cube_stack_multiturn_vdm_reduced_api.yaml (prompts unchanged).

env:
  _target_: capx.envs.tasks.franka.franka_pick_place.FrankaPickPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_low_level
    privileged: false
    apis:
      - FrankaControlApiReducedNoMolmo  # official S3 API without the unavailable Molmo tool
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: place the red cube on top of the green cube and then open the gripper.
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.
    
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

# ---------------------------------------------------------------------------
# Paired harness evaluation settings (frozen; identical for baseline/ours/ablation)
# ---------------------------------------------------------------------------
task_name: cube_stack
harness_mode: baseline   # overridden per condition with --harness-mode

server_url: http://10.120.17.81:5000/llm_gw/v1/chat/completions
model: deepseek-v4.1-flash-1017          # coding agent (reasoning disabled, see capx/llm/client.py)
temperature: 0.2
max_tokens: 8192
visual_differencing_model: qwen3.8-flash  # VDM (reasoning disabled)
visual_differencing_model_server_url: http://10.120.17.81:5000/llm_gw/v1/chat/completions
# API key is read from the CAPX_API_KEY environment variable.

use_img_differencing: true
use_visual_feedback: false
use_parallel_ensemble: false
use_multimodel: false
use_video_differencing: false

budget:
  max_turns: 10            # code executions per episode
  max_model_calls: 24      # coding + VDM calls per episode
  max_total_tokens: 200000 # coding + VDM input+output tokens per episode
  max_sim_steps: 1500      # = robosuite horizon of this task
  max_wall_time_s: 1200
  max_completion_tokens: 8192

record_video: true
output_dir: ./logs/harness_eval/cube_stack
insert_model_in_output_dir: false
max_trial_retries: 1       # no episode reruns
trials: 3
num_workers: 1
